name: Canvas Grade Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-grades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run grade checker
        env:
          CANVAS_TOKEN:   ${{ secrets.CANVAS_TOKEN }}
          GMAIL_ADDRESS:  ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          YOUR_VERIZON:   ${{ secrets.YOUR_VERIZON }}
        run: python Main.py

      - name: Commit updated grades
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add grades.json
          git diff --staged --quiet || git commit -m "Update grades.json"
          git push
