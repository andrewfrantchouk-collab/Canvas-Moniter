name: Canvas Grade Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:         # Lets you trigger it manually from GitHub too

jobs:
  check-grades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore saved grades
        uses: actions/cache@v4
        with:
          path: grades.json
          key: grades-cache-${{ github.run_id }}
          restore-keys: grades-cache-

      - name: Run grade checker
        env:
          CANVAS_TOKEN:   ${{ secrets.CANVAS_TOKEN }}
          GMAIL_ADDRESS:  ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          YOUR_VERIZON:   ${{ secrets.YOUR_VERIZON }}
        run: python main.py

      - name: Save updated grades
        uses: actions/cache/save@v4
        with:
          path: grades.json
          key: grades-cache-${{ github.run_id }}
